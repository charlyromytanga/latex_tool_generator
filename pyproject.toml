[project]
name = "latex-tool-generator"
version = "0.2.0"
description = "Plateforme de génération intelligente de documents de candidature (CV, lettres, etc.) orchestrée par IA."
authors = [
    { name = "Charly-Romy Tanga", email = "charlyromytanga.cytecg@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
keywords = ["cv", "streamlit", "fastapi", "orchestration", "llm", "latex"]

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    # HTTP / async
    "requests>=2.31.0",
    "httpx>=0.25.2",
    "aiohttp>=3.9.1",
    "aiofiles>=23.2.1",
    "anyio>=4.1.0",
    "tenacity>=8.2.3",
    # Date / time
    "python-dateutil>=2.8.2",
    "pytz>=2023.3",
    # Logging / monitoring
    "python-json-logger>=2.0.7",
    "prometheus-client>=0.19.0",
    "flask>=3.1.3",
    "flask-admin>=2.1.0",
    "flask-babel>=4.0.0",
    "flask-appbuilder>=5.2.1",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
cv = [
    "sentence-transformers>=2.2.2",
    "langdetect"
]
emails = [
    "flask-mail>=0.9.1",
    "yagmail",
    "secure-smtplib",
    "emails"

]
lm = [
    "spacy",
    "keybert>=0.7.0"
]
reports = [
    "PyPDF2>=3.0.1",
    "pdfplumber>=0.10.3"
]
api = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Database
    "sqlalchemy>=2.0.23",
    "psycopg[binary]>=3.2.9",
    "pysqlite3-binary>=0.5.4",
    "alembic>=1.13.0",
    
    # NLP
    "spacy",
    "keybert>=0.7.0",
    "sentence-transformers>=2.2.2",
    "langdetect",
    "numpy",
    
    # Document / LaTeX
    "pylatexenc==2.10",
    "latexcodec==2.0",
    "PyPDF2>=3.0.1",
    "Jinja2>=3.1.2",
    "python-docx>=0.8.11",
    "markdown>=3.5.1",
    "chevron>=0.14.0",
    "bleach>=6.1.0",
    "markdownify>=0.11.5",
    "pdfplumber>=0.10.3",
    "pypdf>=4.0.1",
    
    # AI
    "anthropic>=0.89.0",
    "ollama>=0.1.0",
    
    # Config / scheduling
    "omegaconf>=2.3.0",
    "confuse>=2.0.1",
    "APScheduler>=3.10.4",
]

frontend = [
    # Flask web UI
    "flask>=3.1.0",
    "httpx>=0.27.0",
]

app = [
    # UI
    "streamlit>=1.32.0",
    "streamlit-antd-components",
    
    # Templating
    "Jinja2>=3.1.2",
    
    # Accès base de données (requis par db_orchestration.database)
    "sqlalchemy>=2.0.23",
    "pysqlite3-binary>=0.5.4",
    
    # Détection de langue (requis par db_orchestration.ingest)
    "langdetect",
]

runner = [
    # Database
    "sqlalchemy>=2.0.23",
    "psycopg[binary]>=3.2.9",
    "pysqlite3-binary>=0.5.4",
    "alembic>=1.13.0",
    
    # NLP
    "spacy",
    "keybert>=0.7.0",
    "sentence-transformers>=2.2.2",
    "langdetect",
    
    # Document / LaTeX
    "pylatexenc==2.10",
    "latexcodec==2.0",
    "PyPDF2>=3.0.1",
    "Jinja2>=3.1.2",
    "python-docx>=0.8.11",
    "markdown>=3.5.1",
    "chevron>=0.14.0",
    "bleach>=6.1.0",
    "markdownify>=0.11.5",
    "pdfplumber>=0.10.3",
    "pypdf>=4.0.1",
    
    # AI
    "anthropic>=0.89.0",
    "ollama>=0.1.0",
    
    # Config / scheduling
    "omegaconf>=2.3.0",
    "confuse>=2.0.1",
    "APScheduler>=3.10.4",
    
    # UI (certains scripts runner affichent via streamlit)
    "streamlit>=1.32.0",
    "streamlit-antd-components",
]

test = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.1",
    "pylint>=3.0.2",
    "black>=23.12.0",
    "isort>=5.13.2",
    "mypy>=1.7.1",
    "types-requests>=2.31.0.10",
    "click>=8.1.7",
    # Deps applicatives pour les tests d'intégration
    "fastapi>=0.110.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.23",
    "markdown>=3.5.1",
    "streamlit>=1.28.1",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["backend"]
