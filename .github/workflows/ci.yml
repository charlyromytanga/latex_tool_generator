name: CI - Test & Lint

on:
  push:
    branches: [ main, feature/supabase-persistence ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: pip install uv

    - name: Sync dependencies
      run: uv sync --extra test

    - name: Compile check (catches syntax/import errors)
      run: uv run python -m compileall -q backend frontend shared

    - name: Lint with pylint (errors only, informational)
      run: uv run pylint backend frontend shared --disable=all --enable=E,F || true

    - name: Format check with black (informational)
      run: uv run black backend frontend shared --check || true

  docker-build:
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./backend/Dockerfile.backend
        push: false
        tags: latex-tool-backend:ci

    - name: Build frontend image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./frontend/flask_app/Dockerfile.frontend
        push: false
        tags: latex-tool-frontend:ci

  deploy:
    needs: [ lint, docker-build ]
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'feature/supabase-persistence')
    uses: ./.github/workflows/deploy-render.yml
    secrets: inherit
