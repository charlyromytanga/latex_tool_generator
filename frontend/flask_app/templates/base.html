<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% block title %}CV Generator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"/>
    <script src="{{ url_for('static', filename='secure_delete.js') }}" defer></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f5f6f8; color: #1a1a1a; }

        nav { background: #fff; padding: 16px 32px; display: flex; align-items: center; gap: 32px; border-bottom: 1px solid #e8e8e8; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        nav .logo { font-size: 20px; font-weight: bold; color: #1db954; }
        nav a { color: #555; text-decoration: none; font-size: 14px; }
        nav a:hover { color: #111; }
        nav a.active { color: #1db954; }

        .container { max-width: 1200px; margin: 0 auto; padding: 32px; }

        h1 { font-size: 24px; margin-bottom: 8px; }
        .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

        .filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .filters select { background: #fff; color: #333; border: 1px solid #ddd; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
        .filters button { background: #1db954; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; }

        table { width: 100%; border-collapse: collapse; font-size: 14px; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
        thead th { text-align: left; color: #888; font-size: 12px; padding: 10px 14px; border-bottom: 1px solid #eee; background: #fafafa; }
        tbody tr { border-bottom: 1px solid #f0f0f0; cursor: pointer; transition: background 0.15s; }
        tbody tr:hover { background: #f8f9fa; }
        tbody td { padding: 12px 14px; }

        .score-badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .score-high { background: #e8f5ee; color: #1a9a44; }
        .score-mid  { background: #fff3e0; color: #c07800; }
        .score-low  { background: #fce8e8; color: #cc3333; }

        .trend-up      { color: #1a9a44; font-weight: 500; }
        .trend-down    { color: #cc3333; font-weight: 500; }
        .trend-stable  { color: #888; }
        .trend-unknown { color: #bbb; }

        .phase-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; }
        .phase-early   { background: #e8eeff; color: #2255cc; }
        .phase-growth  { background: #e8f5ee; color: #1a9a44; }
        .phase-plateau { background: #fff8e0; color: #c07800; }
        .phase-decline { background: #fce8e8; color: #cc3333; }
        .phase-unknown { background: #f0f0f0; color: #999; }
    </style>
  </head>
  <body>
    <nav>
      <span class="brand">CV Generator</span>
      <a href="{{ url_for('index') }}"      {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
      <a href="{{ url_for('cv_base_list') }}"{% if 'cv_base' in request.endpoint %}class="active"{% endif %}>CV Base</a>
      <a href="{{ url_for('jobs_list') }}"  {% if 'job' in request.endpoint %}class="active"{% endif %}>Jobs</a>
      <a href="{{ url_for('generate') }}"   {% if request.endpoint == 'generate' %}class="active"{% endif %}>Génération</a>
      <a href="{{ url_for('settings') }}"   {% if request.endpoint == 'settings' %}class="active"{% endif %}>Paramètres</a>
    </nav>
    <main>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
    <footer>CV Generator · Flask UI</footer>
  </body>
</html>
