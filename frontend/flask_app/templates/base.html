<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}CV Generator{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}"/>
  <script src="{{ url_for('static', filename='secure_delete.js') }}" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font); background: var(--bg-page); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; font-size: var(--font-size-base); }
    nav { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0 2rem; height: 52px; display: flex; align-items: center; gap: 2rem; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; }
    nav .brand { font-size: 16px; font-weight: 700; color: var(--green); letter-spacing: 0.3px; margin-right: 0.5rem; }
    nav a { color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; }
    nav a:hover { color: var(--text-primary); }
    nav a.active { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
    main { flex: 1; padding: 2rem; max-width: 1140px; margin: 0 auto; width: 100%; }
    h1 { font-size: 24px; font-weight: 700; color: var(--text-primary); margin-bottom: 1.25rem; }
    h2 { font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 0.75rem; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1.25rem 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.25rem; transition: box-shadow 0.2s; }
    .card:hover { box-shadow: var(--shadow-md); }
    .flash { padding: 0.65rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 13px; border-left: 3px solid; }
    .flash.success { background: var(--success-bg); color: var(--success-text); border-color: var(--green); }
    .flash.error   { background: var(--danger-bg);  color: var(--danger-text);  border-color: var(--danger-border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: var(--bg-secondary); color: var(--text-secondary); font-size: var(--font-size-xs); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding: 0.55rem 0.75rem; text-align: left; border-bottom: 2px solid var(--border-strong); }
    td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border-light); color: var(--text-primary); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg-secondary); transition: background 0.15s; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0.45rem 1.1rem; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: var(--font); font-size: 13px; font-weight: 600; text-decoration: none; transition: background 0.15s, transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-hover); }
    .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-strong); }
    .btn-secondary:hover { background: var(--border-light); }
    .btn-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
    .btn-danger:hover { background: var(--danger-text); color: #fff; }
    .btn-sm { padding: 0.25rem 0.7rem; font-size: var(--font-size-xs); }
    label { display: block; font-size: var(--font-size-sm); font-weight: 600; color: var(--text-secondary); margin-bottom: 0.3rem; }
    input[type=text], input[type=email], input[type=number], select, textarea { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); font-family: var(--font); font-size: 13px; color: var(--text-primary); background: var(--bg-card); margin-bottom: 0.9rem; transition: border-color 0.15s, box-shadow 0.15s; }
    input[type=number] { width: 120px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px rgba(29,185,84,0.12); }
    textarea { min-height: 120px; resize: vertical; }
    input::placeholder, textarea::placeholder { color: var(--text-faint); }
    pre { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 1rem; font-size: var(--font-size-sm); overflow-x: auto; white-space: pre-wrap; word-break: break-word; color: var(--text-primary); }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: var(--radius-pill); font-size: var(--font-size-xs); font-weight: 600; line-height: 1.4; }
    .badge-ok, .badge-success { background: var(--success-bg); color: var(--success-text); }
    .badge-err, .badge-danger  { background: var(--danger-bg);  color: var(--danger-text); }
    footer { text-align: center; font-size: var(--font-size-xs); color: var(--text-faint); padding: 1.25rem 1rem; border-top: 1px solid var(--border-light); margin-top: 2rem; }
  </style>
</head>
<body>
<nav>
  <span class="brand">CV Generator</span>
  <a href="{{ url_for('index') }}"      {% if request.endpoint == 'index' %}class="active"{% endif %}>Dashboard</a>
  <a href="{{ url_for('cv_base_list') }}"{% if 'cv_base' in request.endpoint %}class="active"{% endif %}>CV Base</a>
  <a href="{{ url_for('jobs_list') }}"  {% if 'job' in request.endpoint %}class="active"{% endif %}>Jobs</a>
  <a href="{{ url_for('generate') }}"   {% if request.endpoint == 'generate' %}class="active"{% endif %}>Génération</a>
  <a href="{{ url_for('settings') }}"   {% if request.endpoint == 'settings' %}class="active"{% endif %}>Paramètres</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}
      <div class="flash {{ category }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>CV Generator · Flask UI</footer>
</body>
</html>
