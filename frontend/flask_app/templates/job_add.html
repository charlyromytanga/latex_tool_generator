{% extends "base.html" %}
{% block title %}Ajouter un Job{% endblock %}
{% block content %}
<h1>Ajouter un Job</h1>

<div class="card">
  <form method="post">
    <label>ID (optionnel)</label>
    <input type="text" name="id" placeholder="Ex: job_bnp_risk_analyst_fr"/>

    <label>Titre du poste *</label>
    <input type="text" name="title" placeholder="Ex: Market Risk Analyst" required/>

    <label>Entreprise</label>
    <input type="text" name="company" placeholder="Ex: BNP Paribas"/>

    <label>Lieu</label>
    <input type="text" name="location" placeholder="Ex: Paris, France"/>

    <label>Langue</label>
    <select name="language" style="width:auto;">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <label>Description du poste</label>
    <textarea name="offer_text" placeholder="Coller le texte de l'offre ici..."></textarea>

    <button type="submit" class="btn btn-primary">Ajouter</button>
    <a href="{{ url_for('jobs_list') }}" class="btn" style="background:#eee; color:#333; margin-left:0.5rem;">Annuler</a>
  </form>
</div>
{% endblock %}
