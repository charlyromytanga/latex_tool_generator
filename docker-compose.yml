services:
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    image: latex-tool-backend:latest
    container_name: latex-tool-backend
    ports:
      - "5050:5000"  # 5050 (host) → 5000 (container)
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/db  # Persistance de la base SQLite
    networks:
      - latex-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/react-app  # ou ./frontend/vue-app selon ton choix
      dockerfile: Dockerfile
    image: latex-tool-frontend:latest
    container_name: latex-tool-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://backend:5000
    networks:
      - latex-network
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local

networks:
  latex-network:
    driver: bridge


