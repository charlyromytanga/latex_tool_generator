services:
  
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    image: latex-tool-backend:latest
    container_name: latex-tool-backend
    ports:
      - "5050:5000"  # 5050 (host) → 5000 (container)
    env_file:
      - .env
    environment:
      - PROJECT_ROOT=/app
      - DATABASE_PATH=/app/db/jobcv.db
      - CV_TEMPLATE_DIR=/app/shared/service_cv_latex/templates/_col_gauche
      - CV_OUTPUT_DIR=/app/shared/output/FR
      - CV_OUTPUT_BASE=/app/shared/output
    volumes:
      - ./backend/db:/app/db
      - ./docs:/app/docs
      - ./shared/output:/app/shared/output
    networks:
      - latex-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/flask_app/Dockerfile.frontend
    image: latex-tool-frontend:latest
    container_name: latex-tool-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:5000
      - SECRET_KEY=change-me-in-production
      - DELETE_NUMERIC_PASSWORD=${DELETE_NUMERIC_PASSWORD}
      - DELETE_WORD_PASSWORD=${DELETE_WORD_PASSWORD}
    depends_on:
      - backend
    networks:
      - latex-network
    restart: unless-stopped

networks:
  latex-network:
    driver: bridge


